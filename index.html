<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEOW</title>
  <meta name="description" content="MEOW: all your meows in one place. A tiny link board. Save, search, and share links. No login, no server.">
  <link rel="icon" type="image/png" href="favicon.png?v=5">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <canvas id="rain" class="rain" aria-hidden="true"></canvas>
  <!-- Left sidebar: saved links -->
  <aside id="sidebar" class="sidebar" aria-label="Saved meows">
    <div class="side-head">
      <h2>Saved meows <span id="count" class="count">0</span></h2>
      <button id="closeSide" class="icon small" type="button" aria-label="Close sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <input id="search" type="search" placeholder="Search meows…" aria-label="Search links">
    <div id="tags" class="tags" role="group" aria-label="Filter by tag"></div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>No meows yet. 🐾</p>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <div class="content">
    <header class="top">
      <div class="brand">
        <button id="menuBtn" class="icon" type="button" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <img class="logo" src="logo.png?v=6" alt="" width="56" height="56">
        <h1>MEOW</h1>
      </div>
      <div class="top-actions">
        <button id="soundBtn" class="icon sound" type="button" aria-pressed="false" aria-label="Turn rain sound on" title="Rain sound: off">
          <svg class="s-on" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="s-off" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="themeBtn" class="icon" type="button" aria-label="Toggle light/dark theme"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h2>All your meows. One place.</h2>
        <p>Drop a link below and it lands in the litter box on the left.</p>
      </section>

      <form id="addForm" class="add" autocomplete="off">
        <input id="title" placeholder="Title" maxlength="80" required aria-label="Title">
        <input id="url" type="url" placeholder="https://example.com" required aria-label="URL">
        <input id="tag" placeholder="Tag" maxlength="20" aria-label="Tag">
        <button class="primary" type="submit">Meow it</button>
      </form>

      <section class="tools">
        <button id="shareBtn" type="button">Share my meows</button>
        <button id="exportBtn" type="button">Export JSON</button>
        <label class="btn">Import JSON<input id="importFile" type="file" accept="application/json" hidden></label>
      </section>
      <p class="note">Your meows are saved <strong>in this browser only</strong>. Use “Share my meows” or Export to move them.</p>
    </main>

    <footer>MEOW · purring free on GitHub Pages</footer>
  </div>

  <!-- Hover preview card (filled in by app.js) -->
  <div id="preview" class="preview" aria-hidden="true">
    <div class="shot"><img id="previewImg" alt=""><span id="previewMsg">Loading preview…</span></div>
    <div class="cap"><strong id="previewTitle"></strong><small id="previewHost"></small></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=7"></script>
  <script src="rain.js?v=7"></script>
</body>
</html>
